<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Nur root darf den Namen besitzen (Dienst läuft als root) -->
  <policy user="root">
    <allow own="org.gnome.UfwSwitcher"/>
    <allow send_destination="org.gnome.UfwSwitcher"/>
  </policy>

  <!-- Jeder lokale Benutzer darf den Dienst ansprechen.
       Schreibende Methoden werden im Dienst per Polkit abgesichert. -->
  <policy context="default">
    <allow send_destination="org.gnome.UfwSwitcher"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.gnome.UfwSwitcher"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.gnome.UfwSwitcher"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.gnome.UfwSwitcher"
           send_interface="org.gnome.UfwSwitcher"/>
  </policy>
</busconfig>
